[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-to-fcpxml-starter"
version = "0.6.0"
description = "Build portable Final Cut Pro rough-cut FCPXML projects from CSV or Excel plans"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
csv-to-fcpxml = "csv_to_fcpxml:main"
fcpxml-new-project = "create_project:main"
fcpxml-quick = "make_xml:main"
fcpxml-open = "open_in_final_cut:main"

[tool.setuptools]
py-modules = [
    "csv_to_fcpxml",
    "spreadsheet_input",
    "simple_timeline",
    "create_project",
    "make_xml",
    "make_xml_input",
    "preview_report",
    "open_in_final_cut",
]
