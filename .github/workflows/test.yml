name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile csv_to_fcpxml.py spreadsheet_input.py simple_timeline.py create_project.py make_xml.py make_xml_input.py preview_report.py open_in_final_cut.py scripts/*.py
      - run: python -m unittest discover -s tests -v

  demo-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bash scripts/run_demo.sh
      - run: bash scripts/run_quick_demo.sh
      - run: bash scripts/run_title_demo.sh
      - run: bash scripts/run_beginner_demo.sh
